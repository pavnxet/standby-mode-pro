<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- AUDIT.md §5.13: maximum-scale=1.0 + user-scalable=no fails WCAG 2.1.1
       (A) and SC 1.4.4 (Resize Text). Pinch-zoom is allowed again. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StandBy Mode Pro - Smart Clock &amp; Desk Display</title>
  <meta name="description" content="Turn your device into an aesthetic smart display with 3D Flip Clocks, Neon, Matrix, Solar dials, Duo/Quad widgets, Spaces, and ambient Vibes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>" />
  <!-- PWA: relative href so the GitHub Pages sub-path resolves. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StandBy" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    The five web fonts, loaded without blocking the first paint.

    A Lighthouse run in Milestone 5 measured this stylesheet as 990ms of
    render-blocking time, which is more than any single local stylesheet. The
    `media="print"` + `onload` swap is the standard non-blocking pattern: the
    browser parses it at low priority instead of holding the parser, and the
    media flip promotes it once it arrives.

    The cost is a flash of fallback font before the webfont loads. That is the
    right trade for a standby clock - the digits are legible in the fallback and
    the clock is usable immediately - whereas blocking would delay the whole page
    to improve typography nobody is waiting on.

    The noscript fallback keeps the fonts for anyone with scripting disabled,
    where the onload handler never runs.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800;900&family=VT323&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'; this.onload=null;" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800;900&family=VT323&display=swap" rel="stylesheet" />
  </noscript>
  <!--
    Tailwind, precompiled. ADR-015.

    This replaces `<script src="https://cdn.tailwindcss.com">` plus its inline
    config. Measured reasons, from a Lighthouse run in Milestone 5:

      - 124 KB of third-party JavaScript, the largest single transfer on the page
      - 885 ms attributed to it as render-blocking
      - it ran before the app did, so first paint waited on a network round trip
        to a host this project does not control
      - it contradicted the project's own no-CDN rule

    28.5 KB of static CSS, served from the same origin as everything else and
    precached by the service worker. Regenerate with `npm run css:tailwind`; the
    CSS coverage check fails if a class is used that this file does not define.

    Position matters and is unchanged: this link sits exactly where the script
    was, so the cascade order relative to the local stylesheets below is the same
    as before.
  -->
  <link rel="stylesheet" href="css/tailwind-built.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/clocks.css" />
  <!-- Milestone 3 faces. Own file so the legacy stylesheets stay byte-identical. -->
  <link rel="stylesheet" href="css/clocks-m3.css" />
  <link rel="stylesheet" href="css/widgets.css" />
  <link rel="stylesheet" href="css/widgets-m2.css" />
  <!-- Milestone 3 widgets. Own file so the legacy stylesheets stay byte-identical. -->
  <link rel="stylesheet" href="css/widgets-m3.css" />
  <!-- Second Milestone 3 widget pass (C6, C14, C20, C12, C17, C7, C8, C19). -->
  <link rel="stylesheet" href="css/widgets-m3b.css" />
  <!-- Must load last: it overrides focus rings, modal visibility and motion. -->
  <!-- Milestone 4: mixer, dimming, kiosk, wake lock.
    <link rel="stylesheet" href="css/m4.css" />
  <!-- E7 screensaver styles. Loaded after m4.css so its rules win on conflict. -->
  <link rel="stylesheet" href="css/screensaver.css" />
  <!-- Must load last: it overrides focus rings, modal visibility and motion. -->
  <link rel="stylesheet" href="css/a11y.css" />
  <!-- M5: palette, cheat sheet, toasts, layout grid, picker, breathing, permissions. -->
  <link rel="stylesheet" href="css/m5.css" />
</head>
<body class="bg-black text-neutral-100 select-none overflow-hidden h-screen w-screen">
  <div id="ambient-wallpaper-layer"></div>
  <!-- E5 live canvas background. Behind the visualiser so the two never overlap. -->
  <canvas id="live-background-layer"></canvas>
  <canvas id="ambient-canvas-layer"></canvas>
  <div id="app-shell">
    <header id="top-bar" class="autohide-bar">
      <div class="flex items-center gap-2.5">
        <span id="offline-badge" role="status" aria-live="polite">
          <span aria-hidden="true">⚠</span> Offline
        </span>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md text-xs font-mono text-neutral-300">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="battery-status-text">100% PWR</span>
        </div>
        <!--
          A local counter. It counts visits on THIS device and nothing leaves the
          browser - no third-party service is contacted, no identifier is sent and
          there is no consent prompt to accept, because there is nothing to consent
          to. The previous version incremented a global counter at two external
          APIs on every page load, which is tracking.

          The label says "VISITS", not "VIEWS", and the tooltip says "on this
          device": a number labelled "Global All-Time Visitors" that only counts
          one device would be a false claim, which is a different kind of
          dishonesty than the one it replaced.
        -->
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md text-xs font-mono text-neutral-300" title="Times you have opened this app on this device. Nothing is sent anywhere.">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="text-neutral-400 font-semibold text-[11px]">VISITS:</span>
          <span id="global-views-count" class="font-bold text-blue-400 font-mono px-1.5 py-0.5 rounded bg-blue-500/10">1</span>
        </div>
      </div>
      <div id="spaces-nav-container"></div>
      <div class="flex items-center gap-2">
        <button id="btn-stats" class="btn-icon" data-tooltip="Focus Analytics &amp; Insights" aria-label="Statistics"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></button>
        <button id="btn-photos" class="btn-icon" data-tooltip="Smart Photo Frame" aria-label="Photo Frame"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
        <button id="btn-night-mode" class="btn-icon" data-tooltip="Night Tint (N)" aria-label="Night Mode"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        <button id="btn-customize" class="btn-icon" data-tooltip="Customize (Layout &amp; Clocks)" aria-label="Customize"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6V4a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9H20a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"/></svg></button>
        <button id="btn-fullscreen" class="btn-icon" data-tooltip="Fullscreen (F)" aria-label="Fullscreen"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
    </header>
    <main id="main-stage"></main>
  </div>
  
  <!-- Stats & Cloud Sync Modal -->
  <div id="stats-modal" class="modal-overlay">
    <div class="modal-card !max-w-3xl">
      <div class="flex items-center justify-between p-4 sm:p-5 border-b border-white/10 bg-neutral-900/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
          <div>
            <h3 class="font-bold text-sm sm:text-base text-white">Focus Analytics &amp; Cloud Profile</h3>
            <p class="text-[11px] text-neutral-400 font-mono">Cross-Device Sync &amp; Historical Insights</p>
          </div>
        </div>
        <button id="btn-close-stats" class="text-neutral-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition-colors" aria-label="Close stats">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="stats-modal-content" class="p-4 sm:p-6 overflow-y-auto max-h-[80vh]"></div>
    </div>
  </div>

  <!-- Customize Modal -->
  <div id="customize-modal" class="modal-overlay"><div class="modal-card"><div class="flex items-center justify-between p-5 border-b border-white/10"><div class="flex items-center gap-2.5"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6V4a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9H20a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z"/></svg><h3 class="font-bold text-base text-white">StandBy Customization</h3></div><button id="btn-close-customize" class="text-neutral-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition-colors" aria-label="Close customization"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="customize-modal-content" class="p-6 overflow-y-auto"></div></div></div>
  
  <!-- Photo Modal -->
  <div id="photo-modal" class="modal-overlay"><div class="modal-card"><div class="flex items-center justify-between p-5 border-b border-white/10"><div class="flex items-center gap-2.5"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg><h3 class="font-bold text-base text-white">Smart Photo Frame Manager</h3></div><button id="btn-close-photo-modal" class="text-neutral-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition-colors" aria-label="Close photo manager"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="photo-modal-content" class="p-6 overflow-y-auto"></div></div></div>
  
  <!-- Ambient Floating Screensaver Layer -->
  <div id="screensaver-layer"></div>

  <!-- Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
