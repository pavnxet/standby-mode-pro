name: Validate StandBy Mode Pro

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          # The service worker is not under js/, but it is loaded by the browser.
          node --check sw.js

      # Extended in this change. The previous version only matched static
      # `from '...'` imports, which would not catch a broken dynamic import()
      # introduced by lazy module loading (FEATURE_PLAN.md J1/J5).
      - name: Verify static and dynamic imports resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('.').resolve()
          missing = []
          checked = 0

          static_re = re.compile(r"from\s+['\"](\.[^'\"]+)['\"]")
          dynamic_re = re.compile(r"import\s*\(\s*['\"](\.[^'\"]+)['\"]\s*\)")
          bare_re = re.compile(r"^\s*import\s+['\"](\.[^'\"]+)['\"]", re.MULTILINE)

          for path in sorted(root.glob('js/**/*.js')) + sorted(root.glob('js/**/*.mjs')):
              text = path.read_text(encoding='utf-8')
              for pattern in (static_re, dynamic_re, bare_re):
                  for value in pattern.findall(text):
                      target = (path.parent / value).resolve()
                      checked += 1
                      if not target.exists():
                          missing.append(f"{path.relative_to(root)} -> {value}")

          if missing:
              raise SystemExit('Missing local imports:\n  ' + '\n  '.join(missing))
          print(f'Resolved {checked} local imports across all modules.')
          PY

      - name: Verify module entry point
        shell: bash
        run: |
          set -euo pipefail
          index="$(cat index.html)"
          grep -q 'type="module" src="js/app.js"' <<<"$index" || {
            echo 'index.html is not loading the maintained module entry point'; exit 1; }
          if grep -q 'js/app.bundle.js' <<<"$index"; then
            echo 'index.html still references the stale bundle'; exit 1; fi
          echo 'Entry point verified.'

      # New. GitHub Pages serves the app from /standby-mode-pro/, so any
      # root-absolute asset path silently 404s in production.
      - name: Verify deployment-safe relative asset paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          offenders = []
          for name in ['index.html']:
              text = Path(name).read_text(encoding='utf-8')
              for m in re.finditer(r'(?:src|href)="(/[^"]*)"', text):
                  offenders.append(f'{name}: {m.group(0)}')

          # The PWA manifest must also use relative paths, and every icon it
          # references must exist on disk.
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for key in ('start_url', 'scope'):
              if manifest.get(key, '').startswith('/'):
                  offenders.append(f'manifest.webmanifest: {key} = {manifest[key]}')
          for icon in manifest.get('icons', []):
              if icon['src'].startswith('/'):
                  offenders.append(f'manifest.webmanifest icon: {icon["src"]}')
              if not Path(icon['src']).is_file():
                  offenders.append(f'manifest.webmanifest icon missing on disk: {icon["src"]}')

          # The service worker must not reference an absolute origin.
          sw = Path('sw.js').read_text(encoding='utf-8')
          for m in re.finditer(r'["\'](/(?:[a-zA-Z0-9_.-]+/)+[^"\']*)["\']', sw):
              offenders.append(f'sw.js: absolute path {m.group(0)}')

          if offenders:
              raise SystemExit(
                  'Absolute paths break the GitHub Pages sub-path:\n  '
                  + '\n  '.join(offenders))
          print('All asset, manifest, and service worker paths are relative.')
          PY

      - name: Check required application files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest sw.js js/app.js js/state/store.js \
                   js/core/schema.js js/core/registry.js js/core/scheduler.js \
                   js/core/escape.js js/core/a11y.js js/core/notifications.js \
                   js/core/alarmScheduler.js js/core/pwa.js \
                   js/components/modalRuntime.js \
                   js/features/alarmWidget.js js/features/noteWidget.js \
                   js/features/habitWidget.js \
                   js/features/countdownWidget.js js/features/airQualityWidget.js \
                   js/features/sunWidget.js js/features/systemStatusWidget.js \
                   js/features/converterWidget.js js/features/calculatorWidget.js \
                   js/features/goalsWidget.js \
                   js/widgets/index.js \
                   js/core/netPolicy.js js/core/units.js js/core/calculator.js \
                   js/core/timezones.js js/core/clockMath.js js/core/systemStatus.js \
                   js/core/airQuality.js js/core/countdownMath.js js/core/inputParse.js \
                   js/clocks/_shared/numeralMap.js \
                   js/clocks/_shared/primitives.js js/clocks/_shared/solarMath.js \
                   js/clocks/_shared/words.js js/clocks/index.js \
                   js/engines/clockEngine.js js/engines/widgetEngine.js \
                   css/main.css css/clocks.css css/widgets.css css/a11y.css \
                   css/clocks-m3.css css/widgets-m2.css css/widgets-m3.css \
                   assets/icons/icon.svg assets/icons/icon-192.png \
                   assets/icons/icon-512.png assets/icons/icon-maskable-512.png \
                   package.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo 'Required application files present.'

      # New. Every file the service worker precaches must exist, or the cached
      # shell is incomplete and the app fails to render offline.
      - name: Verify service worker precache manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          sw = Path('sw.js').read_text(encoding='utf-8')
          block = sw.split('const SHELL_ASSETS')[1].split('const THIRD_PARTY_HOSTS')[0]
          paths = re.findall(r'"\./([^"]+)"', block)

          if len(paths) < 40:
              raise SystemExit(f'precache list looks too small: {len(paths)} entries')

          missing = [p for p in paths if not Path(p).is_file()]
          if missing:
              raise SystemExit('precached files that do not exist:\n  ' + '\n  '.join(missing))

          print(f'All {len(paths)} precached assets exist.')
          PY

      - name: Check the declarative indexes are complete and unique
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          // FEATURE_PLAN A1 moved registration into one declarative index per
          // kind. This step was rewritten to match.
          //
          // It previously regex-scraped js/app.js for
          //     registerClock('some-id', ...)
          // which found ZERO matches once registration became a loop over the
          // index - so the guard had been checking nothing at all. A regex that
          // silently matches nothing is worse than no check, because it looks
          // like coverage.
          //
          // The indexes are the source of truth, so they are what is verified.
          // (npm test separately imports both indexes and asserts that every
          // entry reaches both registries, which is the property this used to
          // check by proxy.)
          import { readFileSync } from 'node:fs';

          function idsFrom(file) {
            const source = readFileSync(file, 'utf8');
            // Entry lines look like:  { id: "flip", clock: flipClock, ... },
            const ids = [...source.matchAll(/\{\s*id:\s*"([^"]+)"/g)].map((m) => m[1]);
            const dupes = ids.filter((v, i) => ids.indexOf(v) !== i);
            if (dupes.length) {
              throw new Error(`Duplicate ids in ${file}: ${[...new Set(dupes)].sort().join(', ')}`);
            }
            return ids;
          }

          const clocks = idsFrom('js/clocks/index.js');
          const widgets = idsFrom('js/widgets/index.js');

          // Minimums, not exact counts: a minimum catches a registration that
          // silently stopped happening, while an exact count would fail on
          // every legitimate addition and train people to bump it blindly.
          const MIN_CLOCKS = 29;   // 11 legacy + 18 Milestone 3 faces
          const MIN_WIDGETS = 27;  // 9 legacy + 3 Milestone 2 + 15 Milestone 3

          const problems = [];
          if (clocks.length < MIN_CLOCKS) {
            problems.push(`clocks index has ${clocks.length}, expected >= ${MIN_CLOCKS}`);
          }
          if (widgets.length < MIN_WIDGETS) {
            problems.push(`widgets index has ${widgets.length}, expected >= ${MIN_WIDGETS}`);
          }

          // Every index id must be a valid slug, because it becomes a DOM id,
          // a CSS hook and a storage key.
          for (const [label, ids] of [['clock', clocks], ['widget', widgets]]) {
            for (const id of ids) {
              if (!/^[a-z][a-z0-9-]*$/.test(id)) {
                problems.push(`${label} id "${id}" is not a lowercase slug`);
              }
            }
          }

          // app.js must still drive registration from the index. If someone
          // reintroduces a hand-written list, the two diverge silently.
          const app = readFileSync('js/app.js', 'utf8');
          for (const needle of [
            "from './clocks/index.js'",
            "from './widgets/index.js'",
          ]) {
            if (!app.includes(needle)) problems.push(`app.js no longer imports ${needle}`);
          }

          if (problems.length) {
            console.error('Index check failed:');
            for (const p of problems) console.error('  - ' + p);
            process.exit(1);
          }

          console.log(
            `${clocks.length} clocks and ${widgets.length} widgets in the indexes; ` +
            'ids unique, slug-valid, and app.js registers from them.'
          );
          JS

      # New. A widget template that emits a class no stylesheet defines renders
      # unstyled, which in this app means it silently falls back to the legacy
      # viewport-sized widget CSS. Found six such classes by hand, four of them
      # from a previous milestone, so the check is now a gate rather than a habit.
      - name: Widget stylesheet coverage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-css-coverage.mjs

      - name: Unit and audit regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

      # The repository shipped a 231 KB app.bundle.js that has already diverged
      # from source; CI forbids its use. This guard makes sure first-load
      # JavaScript does not silently grow (FEATURE_PLAN.md J4).
      #
      # The budget was raised from 400 KB to 900 KB once Milestone 3 landed 15
      # widgets and 19 clock faces, and from 900 KB to 1000 KB by the owner once
      # M3, M4 and M5 landed on top of that. It is a growth alarm, not a target:
      # the point is to make an unexpected jump visible, and the previous 400 KB
      # threshold could no longer do that.
      - name: Bundle size budget
        shell: bash
        run: |
          set -euo pipefail
          BUDGET_KB=1000
          # Everything reachable as a static import from the entry point, plus
          # the modules index.html loads. The legacy bundle is excluded on purpose.
          TOTAL_KB=$(find js -type f -name '*.js' ! -name 'app.bundle.js' -exec cat {} + | wc -c | awk '{printf "%d", $1/1024}')
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "Source JS is ${TOTAL_KB} KB, over the ${BUDGET_KB} KB budget."
            exit 1
          fi
          echo "Source JS within budget: ${TOTAL_KB} KB / ${BUDGET_KB} KB."